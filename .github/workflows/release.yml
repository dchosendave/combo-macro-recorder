name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft release tag to rebuild (for example, v1.0.12); leave empty to only run Release Please
        required: false
        type: string

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release-please:
    if: ${{ github.event_name == 'push' || inputs.tag == '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Open or update release PR
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Checkout release PR
        if: ${{ steps.release.outputs.pr != '' }}
        uses: actions/checkout@v7
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Setup Node.js for lockfile sync
        if: ${{ steps.release.outputs.pr != '' }}
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Synchronize generated version metadata
        if: ${{ steps.release.outputs.pr != '' }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")
          node scripts/version.mjs "$version"
          if git diff --quiet -- Cargo.lock; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "chore: synchronize Cargo lockfile version"
          git push

  build-draft-release:
    needs: release-please
    if: ${{ always() && (needs.release-please.outputs.release_created == 'true' || inputs.tag != '') }}
    runs-on: windows-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install npm dependencies
        run: npm ci
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Validate release tag and version metadata
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
        run: |
          npm run version:check
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne $env:RELEASE_TAG) {
            throw "Release tag $env:RELEASE_TAG does not match app version v$version"
          }
      - name: Typecheck and build frontend
        run: npm run build
      - name: Frontend tests
        run: npm test
      - name: Backend tests
        run: cargo test --locked
      - name: Build Tauri installers
        run: npx tauri build -- --locked
      - name: Upload installers to draft release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
          draft: true
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
